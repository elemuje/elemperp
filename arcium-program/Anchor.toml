[toolchain]
anchor_version = "0.32.1"

[features]
seeds     = false
skip-lint = false

[programs.devnet]
elemperp_mxe = "ELMPrpXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

[registry]
url = "https://api.apr.dev"

